<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7df1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0db4f;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a1a"/>
  
  <!-- Animated particles -->
  <circle cx="100" cy="80" r="3" fill="#f7df1e" opacity="0.6">
    <animate attributeName="cy" values="80;320;80" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="300" r="2" fill="#61dafb" opacity="0.5">
    <animate attributeName="cy" values="300;100;300" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="350" r="2.5" fill="#f7df1e" opacity="0.4">
    <animate attributeName="cx" values="250;550;250" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- JS Logo -->
  <rect x="50" y="100" width="140" height="140" rx="10" fill="url(#bg)" filter="url(#glow)">
    <animate attributeName="y" values="100;95;100" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="120" y="200" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#1a1a1a" text-anchor="middle">JS</text>
  
  <!-- Main text -->
  <text x="240" y="160" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#f7df1e">
    JavaScript
    <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
  <text x="240" y="210" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#ffffff">
    DEVELOPER
  </text>
  
  <!-- Code brackets decoration -->
  <text x="220" y="165" font-family="monospace" font-size="60" fill="#61dafb" opacity="0.3">{</text>
  <text x="720" y="215" font-family="monospace" font-size="60" fill="#61dafb" opacity="0.3">}</text>
  
  <!-- Decorative code line -->
  <text x="240" y="270" font-family="'Courier New', monospace" font-size="20" fill="#888">
    const <tspan fill="#61dafb">awesome</tspan> = <tspan fill="#f7df1e">true</tspan>;
  </text>
  
  <!-- Excitement elements -->
  <g opacity="0.8">
    <circle cx="680" cy="120" r="8" fill="none" stroke="#f7df1e" stroke-width="2">
      <animate attributeName="r" values="8;15;8" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g opacity="0.8">
    <circle cx="730" cy="160" r="6" fill="none" stroke="#61dafb" stroke-width="2">
      <animate attributeName="r" values="6;12;6" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Stars -->
  <text x="650" y="100" font-size="30" fill="#f7df1e">★</text>
  <text x="700" y="85" font-size="24" fill="#fff">★</text>
  <text x="750" y="110" font-size="28" fill="#61dafb">★</text>
</svg>